# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Inherit shared settings from pissmyran/coderabbit.
# Keep only repository-specific overrides here.
inheritance: true

reviews:
  # Preserve the repository's existing exclusions.
  path_filters:
    - "!tools/docs-site.mjs"
    - "!zensical.toml"

  path_instructions:
    - path: "apps/web/src/{index,auth,access-auth,password-auth,request-security}.ts"
      instructions: |
        When routes or authentication change, check that all protected routes
        require a verified identity. Health and readiness are public exceptions.
        Mutations must enforce the same-origin check.
        Verify Access JWT signature, issuer, audience, expiry and not-before.
        Invalid Access configuration must fail closed, never fall back to
        password authentication. Password mode requires explicit AUTH_MODE.
        Check session signatures, expiry, password-change invalidation and
        cookie attributes for HTTPS and the intended local HTTP setup.
        Keep credentials and tokens out of responses and logs.

    - path: "apps/web/src/{quota,runner,storage,automation-workflow,time,policy}.ts"
      instructions: |
        When application processing changes, check that D1 reserves a monthly
        slot before external submission. Concurrent attempts must not reuse
        a slot or submit the same application twice.
        Check reservation ownership before changing or releasing a slot.
        Submitted and uncertain attempts retain their slots.
        Unknown outcomes must not count as verified or become safe retries.
        Stop new submissions when all ten monthly slots are occupied.
        Preserve Europe/Stockholm month boundaries and execution windows:
        manual runs on days 1-14 and scheduled runs on days 10-13.
        Check workflow retries, cancellation and interrupted-run recovery.
        Failure to save evidence after verification must not resubmit a job.

    - path: "apps/web/src/{runtime-config,config-keys,runtime-migration}.ts"
      instructions: |
        When stored configuration changes, check AES-GCM encryption, fresh IVs,
        HKDF key derivation and compatibility of authenticated data.
        Do not change CONFIG_NAMESPACE without migrating existing ciphertext.
        Preserve previous-key reads during rotation. Re-encryption must not
        overwrite a concurrent configuration update.
        Deployment variables and secrets take precedence over saved values.
        Distinguish unreadable configuration from missing saved configuration.
        Configuration views must never return stored secret values.

    - path: "packages/studentconsulting/src/**"
      instructions: |
        When navigation or submission changes, check trusted origins,
        normalized job URLs and association with the exact externalId.
        Preserve authenticated matching navigation; do not fall back to
        the public job list when trusted matching navigation fails.
        Submission requires explicit autoSubmit and unambiguous controls.
        Do not guess answers to unsupported required questions.
        Record submissionAttempted before activating the submit control.
        Errors after a possible submission effect must produce an unknown
        outcome, not a safe pre-submission failure.
        Verification must check the exact job ID and must never submit a job.
        Preserve applied, not_applied and unknown as distinct outcomes.
        Keep credentials, profile content and filled values out of diagnostics.

    - path: "apps/web/src/providers.ts"
      instructions: |
        When browser lifecycle changes, check cleanup after launch,
        page creation and provider-operation failures.
        Close started browser sessions even when operations fail.
        Enable STUDENTCONSULTING_AUTOSUBMIT only for explicit true.
        Keep browser sessions short to limit Browser Rendering usage.

    - path: "apps/web/src/historical-backfill.ts"
      instructions: |
        When historical import changes, check that it reads authenticated
        StudentConsulting history for the explicitly selected month.
        Import only applications confirmed by StudentConsulting.
        Historical import must never submit new applications.
        Check deduplication and consistency with monthly quota accounting.
        Generate the monthly export only when its verified target is met.

    - path: "apps/web/src/{activity-export,report-storage,notifier}.ts"
      instructions: |
        When monthly exports change, use verified applications from D1.
        Do not count uncertain or failed applications toward completion.
        Preserve the ten-application target, job fields and filename date
        based on the tenth verification in Europe/Stockholm.
        Keep download and email content consistent.
        Email delivery failure must not fail application processing or
        cause an application to be submitted again.
        Keep secrets out of exports, email diagnostics and stored evidence.

    - path: "apps/web/src/{dashboard-data,dashboard-assets,auth-ui}.ts"
      instructions: |
        When dashboard or authentication UI changes, escape untrusted values
        and preserve CSP and no-store response protections.
        Show uncertain reservations separately from verified applications.
        Do not expose secrets through configuration views or error pages.
        UI controls must reflect server-side execution windows and permissions;
        disabling a button is not a substitute for server-side enforcement.

    - path: "apps/web/public/**"
      instructions: |
        When dashboard assets change, check safe rendering of API data,
        compatibility with the existing CSP and authenticated API handling.
        Preserve the distinction between verified results and uncertain slots.
        Check keyboard access, labels and mobile controls when interactions
        change. Report concrete barriers rather than cosmetic preferences.

    - path: "migrations/**"
      instructions: |
        Check D1/SQLite compatibility and upgrades of populated databases.
        Never edit an already applied migration; add a new migration.
        Preserve application uniqueness, reservation ownership and quota state.
        Backfills must account for submitted and uncertain applications.
        For table rebuilds or drops, check data preservation, migration order
        and compatibility with runtime queries during deployment.
        Additive migrations precede deployment; destructive migrations follow
        deployment of code that no longer needs the removed schema.
        Verify that actual deployment instructions support that ordering.

    - path: "docker/**"
      instructions: |
        When container startup or settings import changes, preserve the
        database, evidence, settings and encryption key under /data.
        Generate missing keys only once; never replace an existing key.
        Check private file permissions and treat imported values as data,
        never as shell commands.
        Preserve non-empty environment overrides over saved settings.
        Apply local migrations before starting the server.
        Bundled mode must work without a Cloudflare account.

    - path: "Dockerfile"
      instructions: |
        When runtime dependencies change, check compatibility between
        Wrangler, Miniflare, workerd and the installed Chrome version.
        Preserve non-root execution and access to /data and required caches.
        Include runtime files and migrations in the image.
        Check compatibility with docker/entrypoint.sh.

    - path: "tools/render.mjs"
      instructions: |
        When rendering changes, check replacement of declared placeholders
        from cloudflare.example.env and clear errors for missing values.
        Copying and substitution must not follow links into secret files,
        write into the source tree or copy output recursively into itself.
        Keep secret values out of logs and published artifacts.

    # Use a distinct path key to retain the central Markdown instructions.
    - path: "{README.md,docker/README.md,docs/**}"
      instructions: |
        This repository documents the service in Swedish and maintains an
        English mirror under docs/eng/.
        When documentation changes, update both versions in the same PR:
        README.md maps to docs/eng/index.md, docker/README.md maps to
        docs/eng/docker.md, and docs pages retain their filenames.
        New documentation pages belong in both navigation sections.
        Preserve the distinction between job applications and monthly exports.
        Do not describe reporting to Arbetsformedlingen as a supported feature.
